# 品类风格卡 + 场景策略卡（运营维护）。
# · categories.<品类>：文案的风格基调；scenarios 的 key 集合 = select_scenario 的封闭枚举
# · vocabulary.avoid 是广告法禁用词等硬约束
# · 「通用」卡仅当运营显式点名时使用，系统不会自动回落

categories:
  通用:
    tone: 专业、清晰、可信，像一位靠谱的品类顾问
    structure: [吸引开头, 卖点展开, 参数背书, 行动引导]
    vocabulary:
      use: [优选, 实力, 舒适]
      avoid: [最, 第一, 100%, 根治, 永久]
  母婴-纸尿裤:
    tone: 温柔安心、像有经验的妈妈在分享
    structure: [痛点场景, 核心卖点, 参数背书, 信任状, 行动引导]
    vocabulary:
      use: [亲肤, 锁水, 安心, 温和]
      avoid: [最, 第一, 100%, 根治, 无菌]
    example: |
      夜里换纸尿裤就怕吵醒宝宝？云柔系列热风无纺布表层，尿液瞬时吸收不反渗，
      小屁屁整夜干爽。全域透气腰围不勒小肚肚，9-14kg 的宝宝翻身也服帖。
      0荧光剂0香精，敏肌宝宝也能安心穿。L码 44片装，今晚就试试。
  3C-蓝牙耳机:
    tone: 克制专业、参数说话，像懂行朋友的实在推荐
    structure: [场景切入, 参数对比, 核心体验, 行动引导]
    vocabulary:
      use: [降噪, 续航, 低延迟, 通透]
      avoid: [最, 第一, 100%, 顶级, 完美]
    example: |
      通勤地铁太吵？-42dB 深度降噪，报站声保留、轰鸣声滤掉。
      单耳 8 小时、含仓 32 小时续航，一周两充足够。蓝牙 5.4 连接稳，
      IP54 出汗小雨都不怕。399 元，把安静戴在耳朵上。
  家居-香薰:
    tone: 松弛治愈、有画面感，像生活方式博主的软推荐
    structure: [氛围开场, 感官描写, 工艺参数, 礼赠/自用引导]
    vocabulary:
      use: [香调, 氛围, 仪式感, 天然]
      avoid: [最, 第一, 100%, 治疗, 助眠疗效]
    example: |
      晚风把阳台吹成小院的时候，点一支玫瑰木质调。前调是刚剪下的玫瑰，
      尾调沉进暖木里。天然大豆蜡烧得干净，45 小时慢慢陪完整个季节。
      220g 礼盒装，送人或犒劳自己都刚好。
  家纺-四件套:
    tone: 亲肤舒适、居家感强，像懂生活的朋友在安利好物
    structure: [触感开场, 材质工艺, 参数背书, 换洗场景引导]
    vocabulary:
      use: [亲肤, 全棉, 支数, 耐洗]
      avoid: [最, 第一, 100%, 抗菌, 除螨]
    example: |
      换上车厘子色四件套那晚，卧室像换了季节。60 支长绒棉，摸上去是
      洗过很多次也留着的软。A 类面料直接贴脸睡也安心，活性印染洗了
      三轮还保持着色。1.8m 床通用，趁换季给卧室也换个心情。
  食品-挂耳咖啡:
    tone: 新鲜直接、有生活细节，像咖啡师朋友顺手递来一杯
    structure: [冲泡场景, 风味描写, 烘焙参数, 囤货引导]
    vocabulary:
      use: [风味, 现磨, 烘焙, 便携]
      avoid: [最, 第一, 100%, 减肥, 提神疗效]
    example: |
      早高峰前 90 秒，撕开挂耳、热水绕圈，工位飘起现磨的香气。中度烘焙
      拼配，入口是坚果和黑巧的稳，尾韵带一点柑橘的亮。10g×10 包独立装，
      出差塞两包进电脑包就有底气。

scenarios:
  everyday:
    name: 日常销售
    hints: [日常, 详情页, 介绍]
    rules: [卖点清晰, 使用场景种草, 不出现促销与价格紧迫感]
    example: |
      每天早上一杯,连喝一周也不腻——好喝不贵,日常囤货就够了。
  regular_discount:
    name: 平时打折
    hints: [打折, 折扣, 特惠, 降价]
    rules: [性价比叙事, 原价锚点对比, 轻紧迫感（限时/限量）]
    example: |
      原价 599,今天 399,省下的 200 够吃两顿好饭了。
  month_end_promo:
    name: 月底冲量
    hints: [月底, 月末, 冲量, 冲刺]
    rules: [倒计时紧迫感, 满减/优惠信息置顶, 强化行动号召]
    example: |
      【月底最后 3 天】满 300 减 80,今晚下单,明晚就用上。
  mega_sale:
    name: 平台大促
    hints: ["618", 双11, 年货节, 大促, 周年庆]  # 数字线索要加引号,否则解析成数字
    rules: [全场氛围感, 优惠算账攻略, 囤货清单式表达]
    example: |
      618 攻略:先领券再下单,满 999 减 200,囤一年的量就这么买。
  pre_sale:
    name: 预售
    hints: [预售, 定金, 膨胀, 预约]
    rules: [定金权益讲清楚, 限量预约制造稀缺, 发货节奏透明]
    example: |
      定金 50 抵 150,前 1000 名再送替换装,5 月 31 日 20 点开抢。
  new_launch:
    name: 新品上市
    hints: [新品, 首发, 上新]
    rules: [好奇心钩子开场, 首发权益, 与上一代/同类对比]
    example: |
      等了半年的二代来了:降噪再升级,首发价还比一代便宜 100。
  clearance:
    name: 清仓特卖
    hints: [清仓, 尾货, 断码, 处理]
    rules: [低价直给不绕弯, 数量有限如实说, 断码/瑕疵诚实说明]
    example: |
      断码清仓:S/M 码齐全,L 码只剩 37 件,售完不再补。
  festival:
    name: 节日礼赠
    hints: [送礼, 礼盒, 中秋, 母亲节, 父亲节, 春节]
    rules: [情感叙事开场, 送礼场景具象化, 礼盒感/仪式感]
    example: |
      今年中秋,把这份"刚剪下的玫瑰"寄给妈妈——礼盒已备好。
  membership:
    name: 会员专享
    hints: [会员, 老客, 召回, 专属]
    rules: [专属感（仅限会员）, 会员价/积分权益, 复购提醒]
    example: |
      老朋友回来啦:会员专享价再叠 200 积分,只此三天。
  seeding:
    name: 种草内容
    hints: [种草, 小红书, 笔记, 分享]
    rules: [第一人称体验, 生活化口语, 弱销售感（软性带出商品）]
    example: |
      用了三周,说个真实感受:地铁里听不到报站以外的声音。
